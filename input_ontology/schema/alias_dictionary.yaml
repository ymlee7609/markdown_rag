# Alias Dictionary (시드)
# canonical 엔티티 ID에 매핑되는 약어, 별칭, 한국어 동의어를 정의한다.
# scripts/extract_onto_candidates.py 가 청크 내 토큰을 이 사전과 매칭해
# onto_protocol_ids / onto_concept_ids 후보를 만든다.
#
# 규칙:
#   - canonical ID는 entity_types.yaml의 id_prefix 규칙을 따른다 (영어 lowercase-kebab).
#   - aliases는 case-insensitive 매칭이지만 한글은 그대로 매칭.
#   - 짧은 약어(예: "IP", "AS")는 false positive 위험이 커서 의도적으로 제외하거나
#     context window 검사를 추가로 요구한다 (요구 토큰 옆에 다른 키워드 동반 필요).
#
# 1차 시드: 45개 핵심 프로토콜 + 한국어 네트워킹 용어. M2/M3에서 확장.

version: 1.0.0
last_updated: 2026-05-22

# 매칭 정책
match_policy:
  case_sensitive: false       # 영어는 대소문자 무시
  korean_exact: true          # 한국어는 정확히 일치
  min_token_length: 3         # 3자 미만 토큰은 단독 매칭 금지 (IP, AS 등)
  require_context_tokens:     # 짧은 토큰은 동반 키워드 필요
    "IP":  ["address", "routing", "subnet", "header", "주소", "라우팅"]
    "AS":  ["BGP", "path", "number", "경계", "자율시스템"]
    "DR":  ["OSPF", "designated", "backup", "BDR"]
    "BDR": ["OSPF", "designated", "backup", "DR"]

